name: UART simulation
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested simulator package
        run: python -m pip install verilator==5.48.0
      - name: Run regression
        run: make regression VERILATOR=verilator-cli
